<!-- 文章封面：列表页缩略图 + 文章页 hero 样式 -->
<style>
  /* 列表页：左侧封面缩略图，右侧标题/摘要 */
  .list__item.archive__item--with-cover .archive__item {
    display: flex;
    align-items: flex-start;
    gap: 1.25em;
  }
  .archive__item-teaser--cover {
    flex: 0 0 auto;
    width: 9.5em;
    max-width: 35%;
    margin: 0;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
  }
  .archive__item-teaser--cover img {
    display: block;
    width: 100%;
    height: 9.5em;
    object-fit: cover;
  }
  .list__item.archive__item--with-cover .archive__item-body {
    flex: 1 1 auto;
    min-width: 0;
  }
  @media (max-width: 37.5em) {
    .list__item.archive__item--with-cover .archive__item {
      gap: 0.85em;
    }
    .archive__item-teaser--cover {
      width: 6.5em;
    }
    .archive__item-teaser--cover img {
      height: 6.5em;
    }
  }

  /* 文章页 hero：保证封面 banner 高度合适、铺满 */
  .page__hero--overlay {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ===== 主页封面 + 透明 masthead ===== */
  body.layout--home .home-hero {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 35vh;
    background-image: url('/assets/images/cover.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
  }
  body.layout--home .home-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.35) 60%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  /* masthead 浮在 hero 上方，透明背景 + 白字 */
  body.layout--home .masthead {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: transparent;
    border-bottom: 0;
  }
  body.layout--home .masthead .greedy-nav,
  body.layout--home .masthead .greedy-nav__toggle:before {
    background: transparent;
  }
  body.layout--home .masthead .site-title,
  body.layout--home .masthead .site-subtitle,
  body.layout--home .masthead .visible-links a,
  body.layout--home .masthead .hidden-links a,
  body.layout--home .masthead .search__toggle,
  body.layout--home .masthead .greedy-nav__toggle {
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  }
  body.layout--home .masthead .visible-links a:before {
    background: #ffffff;
  }
  body.layout--home .masthead .search__toggle:hover {
    color: #f0f0f0;
  }
  /* 内容区起始位置在 hero 之下 */
  body.layout--home #main {
    position: relative;
    z-index: 1;
    margin-top: 35vh;
    background: #ffffff;
    padding-top: 1.5em;
  }
  body.layout--home .home__archive {
    animation: home-fade-in 0.4s ease both;
  }
  @keyframes home-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  /* 移动端：略矮的 hero，避免占满整屏 */
  @media (max-width: 37.5em) {
    body.layout--home .home-hero { height: 30vh; }
    body.layout--home #main { margin-top: 30vh; }
  }
</style>
