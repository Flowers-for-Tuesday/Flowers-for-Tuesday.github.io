<!-- 文章封面：列表页缩略图 + 文章页 hero 样式 -->
<style>
  /* 列表页：左侧封面缩略图，右侧标题/摘要 */
  .list__item.archive__item--with-cover .archive__item {
    display: flex;
    align-items: flex-start;
    gap: 1.25em;
  }
  .archive__item-teaser--cover {
    flex: 0 0 auto;
    width: 9.5em;
    max-width: 35%;
    margin: 0;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
  }
  .archive__item-teaser--cover img {
    display: block;
    width: 100%;
    height: 9.5em;
    object-fit: cover;
  }
  .list__item.archive__item--with-cover .archive__item-body {
    flex: 1 1 auto;
    min-width: 0;
  }
  @media (max-width: 37.5em) {
    .list__item.archive__item--with-cover .archive__item {
      gap: 0.85em;
    }
    .archive__item-teaser--cover {
      width: 6.5em;
    }
    .archive__item-teaser--cover img {
      height: 6.5em;
    }
  }

  /* 文章页 hero：保证封面 banner 高度合适、铺满 */
  .page__hero--overlay {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

</style>
