<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#f8f9f6">
  <title>$title</title>
  <link rel="icon" href="$root/favicon.ico" sizes="any">
  <link rel="preload" href="$root/assets/fonts/tokyo-romance.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="$root/assets/css/site.css">
  $extra_head
  <script src="$root/assets/js/site.js" defer></script>
</head>
<body data-page="$page">
  <a class="skip-link" href="#main">跳至正文</a>
  <header class="site-header wrap">
    <a class="site-brand" href="$root/" aria-label="Flowers for Tuesday 主页">
      <img src="$root/favicon.ico" width="34" height="34" alt="">
      <span>Flowers for Tuesday</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>菜单 <span aria-hidden="true">☰</span></button>
    <nav id="site-nav" class="site-nav" aria-label="主导航">$navigation</nav>
  </header>
  <main id="main" class="wrap" tabindex="-1">$main</main>
  <footer class="site-footer wrap">
    <div><a class="footer-name" href="$root/">Flowers for Tuesday</a><p>$footer_text</p></div>
    <div class="footer-links">$replay<a href="$github">GitHub <span aria-hidden="true">↗</span></a><a href="#main">回到顶部 <span aria-hidden="true">↑</span></a></div>
  </footer>
  $intro
</body>
</html>
