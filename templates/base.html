<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#f8f9f6">
  <script src="$root/assets/js/theme.js"></script>
  <title>$title</title>
  <link rel="icon" href="$root/favicon.ico" sizes="any">
  <link rel="preload" href="$root/assets/fonts/tokyo-romance.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="$root/assets/css/site.css">
  $extra_head
  <link rel="stylesheet" href="$root/assets/css/theme.css">
  <script src="$root/assets/js/site.js" defer></script>
</head>
<body data-page="$page">
  <a class="skip-link" href="#main">跳至正文</a>
  <header class="site-header wrap">
    <a class="site-brand" href="$root/" aria-label="Flowers for Tuesday 主页">
      <img src="$root/favicon.ico" width="34" height="34" alt="">
      <span>Flowers for Tuesday</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>菜单 <span aria-hidden="true">☰</span></button>
    <nav id="site-nav" class="site-nav" aria-label="主导航">$navigation</nav>
    <button class="theme-toggle" type="button" aria-label="深色模式" aria-pressed="false" title="切换到深色模式" hidden>
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.3A8.5 8.5 0 0 1 10.7 3.5a8.5 8.5 0 1 0 9.8 9.8Z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    </button>
  </header>
  <main id="main" class="wrap" tabindex="-1">$main</main>
  <footer class="site-footer wrap">
    <p>$footer_text</p>
    <div class="footer-links">$footer_links<a href="mailto:$email" title="$email">Email <span aria-hidden="true">↗</span></a><a href="#main">回到顶部 <span aria-hidden="true">↑</span></a></div>
  </footer>
  $intro
</body>
</html>
