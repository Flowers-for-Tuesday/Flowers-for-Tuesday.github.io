# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Flowers for Tuesday
email: flowersfortuesday@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Here I stand.
twitter_username: username
github_username: username
minimal_mistakes_skin: dirt
search: true

# Build settings
markdown: kramdown
kramdown:
  math_engine: nil
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Asia/Shanghai # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
future: true

collections:
  thoughts:
    output: true
    permalink: /thoughts/:title/

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "礼拜二的花束"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : 刻下的话语，浮现心头： <br>将我的平庸，弃置于此。
  links:
    - label: "Beijing, China"
      icon: "fas fa-fw fa-map-marker-alt"
      url: "#"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Flowers-for-Tuesday"
    - label: "Zhihu"
      icon: "fa-fw icon-zhihu"
      url: "https://www.zhihu.com/people/flowersfortuesday"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:flowersfortuesday@gmail.com"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Flowers-for-Tuesday"
    - label: "Zhihu"
      icon: "fa-fw icon-zhihu"
      url: "https://www.zhihu.com/people/flowersfortuesday"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: false
      related: true
      toc: true
      toc_sticky: true
      toc_label: "INDEX"
      toc_icon: "list-ul"
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _thoughts
  - scope:
      path: ""
      type: thoughts
    values:
      layout: thought
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
